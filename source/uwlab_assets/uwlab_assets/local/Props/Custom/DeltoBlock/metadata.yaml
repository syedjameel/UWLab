# DeltoBlock -- 34 x 34 x 34 mm solid cuboid, 0.03 kg. Every extent sits inside the
# 24.67 .. 41.48 mm full-body grasp window of the suffix-level close posture.
# Root is at the bounding-box centre;
# the mating and resting points are the bottom-face centre.
dimensions_m: [0.034, 0.034, 0.034]
mass_kg: 0.03
assembled_offset:
  pos: [0.0, 0.0, -0.017]
  quat: [1.0, 0.0, 0.0, 0.0]
bottom_offset:
  pos: [0.0, 0.0, -0.017]
  quat: [1.0, 0.0, 0.0, 0.0]
